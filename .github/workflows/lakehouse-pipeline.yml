name: lakehouse-pipeline
on:
  push:
    paths: ["lakehouse-pipeline/**", ".github/workflows/lakehouse-pipeline.yml"]
  pull_request:
    paths: ["lakehouse-pipeline/**", ".github/workflows/lakehouse-pipeline.yml"]
  schedule:
    - cron: "0 5 * * *"   # daily 05:00 UTC
  workflow_dispatch:

defaults:
  run:
    working-directory: lakehouse-pipeline

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt pytest
      # Runs the whole pipeline (ingest -> dbt build incl. 39 data tests) and checks it against the clean source.
      - run: pytest
      - uses: actions/upload-artifact@v4
        with:
          name: lake-and-dq-report
          path: |
            lakehouse-pipeline/data/lake/*.parquet
            lakehouse-pipeline/data/dq_report.json
